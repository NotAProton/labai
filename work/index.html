<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            background: #252526;
            padding: 12px 16px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }
        
        .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
            transition: background 0.2s ease;
        }
        
        .status-dot.connected {
            background: #4ec9b0;
        }
        
        .status-dot.disconnected {
            background: #f48771;
            animation: none;
        }
        
        .status-dot.updating {
            background: #ce9178;
            animation: pulse-fast 0.5s;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.2); }
        }
        
        .timestamp {
            color: #858585;
            font-size: 12px;
        }
        
        .pdf-container {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2d2d30;
            position: relative;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #4ec9b0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #f48771;
            color: #1e1e1e;
            padding: 12px 16px;
            border-radius: 4px;
            display: none;
            font-size: 13px;
            max-width: 300px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 20;
        }
        
        .error-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="status-group">
                <div class="status">
                    <div class="status-dot connected" id="statusDot"></div>
                    <span id="statusText">Connecting...</span>
                </div>
                <div class="status">
                    <span class="timestamp" id="timestamp">—</span>
                </div>
            </div>
            <div class="status">
                <span class="timestamp" id="wsStatus">WebSocket: connecting</span>
            </div>
        </div>
        <div class="pdf-container">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
            </div>
            <iframe id="pdfViewer" src="main.pdf" type="application/pdf"></iframe>
        </div>
    </div>
    
    <div class="error-message" id="errorMessage"></div>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const timestamp = document.getElementById('timestamp');
        const wsStatus = document.getElementById('wsStatus');
        const pdfViewer = document.getElementById('pdfViewer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorMessage = document.getElementById('errorMessage');
        
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 10;
        const reconnectDelay = 1000; // 1 second
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }
        
        function updateStatus(connected) {
            if (connected) {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Watching for changes...';
                wsStatus.textContent = 'WebSocket: connected';
                reconnectAttempts = 0;
            } else {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Waiting to connect...';
                wsStatus.textContent = `WebSocket: disconnected (attempt ${reconnectAttempts}/${maxReconnectAttempts})`;
            }
        }
        
        function reloadPDF() {
            statusDot.classList.add('updating');
            statusText.textContent = 'Reloading PDF...';
            loadingOverlay.classList.add('show');
            
            const cacheBreaker = Date.now();
            pdfViewer.src = `main.pdf?t=${cacheBreaker}`;
            
            // Update timestamp
            const now = new Date();
            timestamp.textContent = now.toLocaleTimeString();
            
            // Reset status after reload
            setTimeout(() => {
                statusDot.classList.remove('updating');
                statusText.textContent = 'Watching for changes...';
                loadingOverlay.classList.remove('show');
            }, 800);
        }
        
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    console.log('✅ WebSocket connected');
                    updateStatus(true);
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        if (data.type === 'pdf_updated') {
                            console.log('📄 PDF update received');
                            reloadPDF();
                        }
                    } catch (e) {
                        console.error('Error parsing message:', e);
                    }
                };
                
                ws.onerror = (error) => {
                    console.error('❌ WebSocket error:', error);
                    updateStatus(false);
                    showError('WebSocket connection error');
                };
                
                ws.onclose = () => {
                    console.log('❌ WebSocket disconnected');
                    updateStatus(false);
                    
                    // Attempt to reconnect
                    if (reconnectAttempts < maxReconnectAttempts) {
                        reconnectAttempts++;
                        console.log(`Attempting to reconnect (${reconnectAttempts}/${maxReconnectAttempts})...`);
                        setTimeout(connectWebSocket, reconnectDelay);
                    } else {
                        showError('Failed to connect after multiple attempts. Check if server is running.');
                    }
                };
            } catch (error) {
                console.error('Failed to create WebSocket:', error);
                updateStatus(false);
                setTimeout(connectWebSocket, reconnectDelay);
            }
        }
        
        // Start connection
        console.log('🚀 LaTeX hot reload client started');
        updateStatus(false);
        connectWebSocket();
    </script>
</body>
</html>
